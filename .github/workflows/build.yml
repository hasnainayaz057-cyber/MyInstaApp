name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Organize Project Structure & Create Gradle Configs
        run: |
          mkdir -p app/src/main/java app/src/main/res/values
          mv *.kt app/src/main/java/ 2>/dev/null || true
          mv AndroidManifest.xml app/src/main/ 2>/dev/null || true
          mv strings.xml app/src/main/res/values/ 2>/dev/null || true

          if [ ! -f settings.gradle ]; then
            echo "include ':app'" > settings.gradle
          fi

          if [ ! -f build.gradle ]; then
            echo "plugins {" > build.gradle
            echo "    id 'com.android.application' version '8.2.0' apply false" >> build.gradle
            echo "    id 'org.jetbrains.kotlin.android' version '1.9.0' apply false" >> build.gradle
            echo "}" >> build.gradle
          fi

          if [ ! -f app/build.gradle ]; then
            echo "plugins {" > app/build.gradle
            echo "    id 'com.android.application'" >> app/build.gradle
            echo "    id 'org.jetbrains.kotlin.android'" >> app/build.gradle
            echo "}" >> app/build.gradle
            echo "android {" >> app/build.gradle
            echo "    namespace 'com.example.myinstaapp'" >> app/build.gradle
            echo "    compileSdk 34" >> app/build.gradle
            echo "    defaultConfig {" >> app/build.gradle
            echo "        applicationId \"com.example.myinstaapp\"" >> app/build.gradle
            echo "        minSdk 24" >> app/build.gradle
            echo "        targetSdk 34" >> app/build.gradle
            echo "        versionCode 1" >> app/build.gradle
            echo "        versionName \"1.0\"" >> app/build.gradle
            echo "    }" >> app/build.gradle
            echo "}" >> app/build.gradle
          fi

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
