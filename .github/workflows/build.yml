name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          mkdir -p extracted_project
          unzip -q MyInstaApp.zip -d extracted_project
          echo "Listing all files in workspace:"
          find extracted_project -maxdepth 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        run: |
          # Find the folder that actually contains gradlew
          GRADLEW_DIR=$(dirname "$(find extracted_project -name "gradlew" -type f | head -n 1)")
          echo "Target project folder is: $GRADLEW_DIR"
          
          cd "$GRADLEW_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            extracted_project/**/app/build/outputs/apk/debug/app-debug.apk
            extracted_project/**/build/outputs/apk/debug/*.apk
            
