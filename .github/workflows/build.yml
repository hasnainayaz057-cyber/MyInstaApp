name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          mkdir -p extracted_project
          unzip -q MyInstaApp.zip -d extracted_project
          echo "--- Root directory files ---"
          ls -la
          echo "--- Extracted project files ---"
          ls -la extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        run: |
          # If gradlew is nested one level deep, find it explicitly
          if [ -f "extracted_project/gradlew" ]; then
            cd extracted_project
          else
            # Enter the first subdirectory inside extracted_project
            SUBDIR=$(ls -d extracted_project/*/ | head -n 1)
            echo "Entering subdirectory: $SUBDIR"
            cd "$SUBDIR"
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/app/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/debug/*.apk
            
