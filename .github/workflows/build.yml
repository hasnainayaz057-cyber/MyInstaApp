name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Organize Project Structure
        run: |
          # Create standard Android directories if they don't exist
          mkdir -p app/src/main/java app/src/main/res/values
          
          # Move Kotlin source files into the source directory
          mv *.kt app/src/main/java/ 2>/dev/null || true
          
          # Move manifest and resource files into place if they are in root
          mv AndroidManifest.xml app/src/main/ 2>/dev/null || true
          mv strings.xml app/src/main/res/values/ 2>/dev/null || true

      - name: Generate Gradle Wrapper
        run: |
          # If gradlew doesn't exist, generate it automatically
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
